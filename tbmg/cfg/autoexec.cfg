sv_cheats 1
developer 0
con_notifytime 0
con_enable 1
hud_fastswitch 1
mat_hdr_level 2
mat_autoexposure_max 1.0
mat_autoexposure_min 0.5
mat_bloomscale 0.12

// Tactical Console Aliases (usable inside the built-in ~ Developer Console)
alias "arsenal" "give item_suit; impulse 101; give item_healthkit; give item_battery"
alias "spawn_cop" "npc_create_equipment weapon_smg1; wait 5; npc_create npc_metropolice"
alias "spawn_soldier" "npc_create_equipment weapon_ar2; wait 5; npc_create npc_combine_s"
alias "spawn_rebel" "npc_create_equipment weapon_smg1; wait 5; npc_create npc_citizen"
alias "spawn_zombie" "npc_create npc_zombie"
alias "spawn_jeep" "ch_createjeep"
alias "spawn_airboat" "ch_createairboat"
alias "spawn_barrel" "prop_physics_create props_c17/oildrum001_explosive.mdl"

// Quick Tactical Binds
bind "`" "toggleconsole"
bind "v" "noclip"
bind "f1" "arsenal"
bind "f2" "spawn_cop"
bind "f3" "spawn_soldier"
bind "f4" "spawn_rebel"
bind "f5" "spawn_barrel"
bind "f6" "spawn_jeep"
bind "f7" "spawn_airboat"
bind "f8" "god"

echo "====================================================================="
echo "  TBMG: Country & MainCity2 — Standalone Source Engine 2013"
echo "====================================================================="
echo "  Built-in Developer Console Active (developer 0 - No Corner Spam)"
echo "  Tactical Binds:"
echo "    [~]  Toggle Built-in Developer Console"
echo "    [V]  Toggle Noclip Flight"
echo "    [F1] Full Arsenal + HEV Suit + Ammo (arsenal / impulse 101)"
echo "    [F2] Spawn Combine Metrocop        (spawn_cop)"
echo "    [F3] Spawn Combine Soldier         (spawn_soldier)"
echo "    [F4] Spawn Resistance Citizen      (spawn_rebel)"
echo "    [F5] Spawn Explosive Barrel        (spawn_barrel)"
echo "    [F6] Spawn Drivable Scout Buggy    (spawn_jeep / ch_createjeep)"
echo "    [F7] Spawn Drivable Airboat        (spawn_airboat / ch_createairboat)"
echo "    [F8] Toggle Godmode                (god)"
echo "====================================================================="
